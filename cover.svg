<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#f6f3ec"/>
      <stop offset="55%"  stop-color="#ece8df"/>
      <stop offset="100%" stop-color="#e2ded2"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#46514a"/>
      <stop offset="55%"  stop-color="#6d7d72"/>
      <stop offset="100%" stop-color="#a8b6a6"/>
    </linearGradient>
    <linearGradient id="av" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#6f7f72"/>
      <stop offset="100%" stop-color="#414c44"/>
    </linearGradient>
  </defs>

  <!-- 底 -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="8" fill="url(#bar)"/>

  <!-- 右侧印章式圆环 -->
  <g opacity="0.9">
    <circle cx="925" cy="315" r="152" fill="none" stroke="#6b8577" stroke-opacity="0.30" stroke-width="1.6"/>
    <circle cx="925" cy="315" r="138" fill="none" stroke="#6b8577" stroke-opacity="0.16" stroke-width="1"/>
    <text x="925" y="315" text-anchor="middle" dominant-baseline="central"
          font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif"
          font-size="108" font-weight="600" fill="#4c5a50" fill-opacity="0.17">傅</text>
  </g>

  <!-- 左侧信息 -->
  <g font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
    <!-- 头像 -->
    <circle cx="132" cy="196" r="56" fill="url(#av)"/>
    <text x="132" y="196" text-anchor="middle" dominant-baseline="central"
          font-size="62" font-weight="600" fill="#ffffff">傅</text>

    <!-- 姓名 -->
    <text x="216" y="215" font-size="76" font-weight="700" fill="#333630" letter-spacing="6">傅浩</text>

    <!-- 职位 -->
    <text x="88" y="330" font-size="33" font-weight="600" fill="#4c5a50" letter-spacing="1">技术质量与数字化管理部 副部长</text>

    <!-- 单位 -->
    <text x="88" y="382" font-size="27" fill="#7a8078" letter-spacing="1">中冶武勘工程技术有限公司</text>

    <!-- 分隔线 -->
    <line x1="88" y1="424" x2="470" y2="424" stroke="#c9c3b5" stroke-width="1.2"/>

    <!-- 联系方式 -->
    <text x="88" y="474" font-size="23" fill="#7a8078" letter-spacing="0.5">13871249092</text>
    <circle cx="252" cy="467" r="2.6" fill="#a8ada6"/>
    <text x="272" y="474" font-size="23" fill="#7a8078" letter-spacing="0.5">119077750@qq.com</text>
  </g>

  <!-- 右下角提示 -->
  <g font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
    <rect x="88" y="516" width="252" height="46" rx="23" fill="#4c5a50"/>
    <text x="214" y="539" text-anchor="middle" dominant-baseline="central"
          font-size="19" fill="#f2efe8" letter-spacing="2">点击保存到通讯录</text>
  </g>
</svg>
